<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F4EF">
<title>回血实验室 · 演示版</title>
<style>
  :root{
    --paper:#F7F4EF; --card:#FFFFFF; --card2:#F1ECE4;
    --ink:#201E1B; --dim:#6E6659; --faint:#9C9488;
    --hair:#E3DBD0; --track:#EDE7DD;
    --accent:#3D5A4A; --olive:#5A7A4C; --clay:#BF5B3F; --wheat:#B0842E;
    --sea:#4A87C4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  body{min-height:100vh}
  #app{max-width:520px;margin:0 auto;padding:22px 20px 108px;min-height:100vh}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
  .brand{font-size:19px;font-weight:600;letter-spacing:.5px}
  .sub{font-size:11.5px;color:var(--faint);margin-top:4px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;
    background:var(--card);border:1px solid var(--hair);font-size:11.5px;color:var(--dim)}
  .card{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:16px;margin-bottom:12px}
  .hero{display:flex;gap:16px;align-items:center}
  .ring{position:relative;width:104px;height:104px;flex:0 0 auto}
  .ring svg{transform:rotate(-90deg)}
  .ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .big{font-size:27px;font-weight:600;line-height:1}
  .ring .small{font-size:10px;color:var(--faint);margin-top:2px}
  .cap{font-size:10.5px;color:var(--faint);letter-spacing:1px}
  .headline{font-size:15px;font-weight:600;margin:6px 0 8px;line-height:1.4}
  .band{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border-radius:999px}
  .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
  details{margin-top:10px}
  summary{font-size:11.5px;color:var(--accent);cursor:pointer;list-style:none}
  summary::-webkit-details-marker{display:none}
  .reasons{margin:8px 0 0;padding:0;list-style:none}
  .reasons li{font-size:11.5px;color:var(--dim);line-height:1.65;padding-left:10px;position:relative}
  .reasons li::before{content:"";position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%;background:var(--faint)}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:15px;font-weight:600;
    background:var(--accent);color:#FBF9F5;cursor:pointer;font-family:inherit}
  .btn:active{opacity:.88}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--hair);font-weight:500;padding:12px;font-size:13.5px}
  .btn:disabled{opacity:.45}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .tile{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:11px 9px;text-align:center;cursor:pointer}
  .tile svg{display:block;margin:0 auto 6px}
  .tile b{display:block;font-size:12.5px;font-weight:600}
  .tile span{display:block;font-size:10px;color:var(--faint);margin-top:2px}
  .row{display:flex;align-items:center;gap:12px}
  .avatar{flex:0 0 auto;display:block}
  .bubble{font-size:13px;line-height:1.6;color:var(--ink)}
  .nameline{font-size:13.5px;font-weight:600}
  .mood{font-size:10.5px;color:var(--faint);margin-left:6px;font-weight:400}
  .cta{font-size:12px;color:var(--accent);margin-top:8px;cursor:pointer}
  h2{font-size:22px;font-weight:600;margin:6px 0 14px}
  h3{font-size:12px;color:var(--faint);font-weight:500;letter-spacing:1px;margin:20px 0 8px}
  .rec{border:1px solid var(--hair);border-radius:16px;background:var(--card);padding:14px;margin-bottom:10px;cursor:pointer}
  .rec .r1{display:flex;align-items:center;gap:10px}
  .tag{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:600;flex:0 0 auto}
  .rec .t{font-size:14.5px;font-weight:600;flex:1}
  .rec .m{font-size:11px;color:var(--faint)}
  .cue{font-size:12px;color:var(--dim);margin:9px 0 0;line-height:1.5}
  .why{font-size:11px;color:var(--accent);margin-top:8px}
  .back{font-size:13px;color:var(--dim);margin-bottom:14px;cursor:pointer;display:inline-block}
  .timerwrap{text-align:center;padding:18px 0 8px}
  .tnum{font-size:52px;font-weight:600;font-variant-numeric:tabular-nums}
  .tlabel{font-size:12px;color:var(--faint);margin-top:6px}
  .rates{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .rate{border:1px solid var(--hair);border-radius:12px;padding:13px;font-size:14px;text-align:center;cursor:pointer;background:var(--card)}
  .rate.sel{background:var(--olive);color:#fff;border-color:var(--olive)}
  .stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat div{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:13px}
  .stat b{display:block;font-size:26px;font-weight:600;line-height:1.1}
  .stat span{display:block;font-size:10.5px;color:var(--faint);margin-top:5px}
  .bar{height:6px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:var(--olive);border-radius:99px}
  .bl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim)}
  .nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--hair);
    display:flex;justify-content:center}
  .nav .in{max-width:520px;width:100%;display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
  .nav button{flex:1;background:none;border:0;padding:6px 0;font-family:inherit;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--faint)}
  .nav button.on{color:var(--accent);font-weight:600}
  .foot{font-size:10.5px;color:var(--faint);line-height:1.7;margin-top:18px}
  .bubblecard{background:var(--card2);border:1px solid var(--hair);border-radius:12px;padding:11px 12px;font-size:12.5px;
    color:var(--dim);line-height:1.6;margin-top:10px}
  .chatline{display:flex;gap:8px;margin-bottom:10px}
  .chatline.me{justify-content:flex-end}
  .chatline .b{max-width:78%;padding:10px 12px;border-radius:14px;font-size:13px;line-height:1.6}
  .chatline.me .b{background:var(--olive);color:#fff;border-bottom-right-radius:4px}
  .chatline.ai .b{background:var(--card2);border:1px solid var(--hair);border-bottom-left-radius:4px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
  .chip{white-space:nowrap;border:1px solid var(--hair);background:var(--card);border-radius:99px;
    padding:7px 12px;font-size:12px;color:var(--dim);cursor:pointer}
  .inputbar{display:flex;gap:8px;position:sticky;bottom:0;background:var(--paper);padding:8px 0}
  .inputbar input{flex:1;border:1px solid var(--hair);background:var(--card);border-radius:12px;padding:12px;
    font-size:13.5px;font-family:inherit;color:var(--ink)}
  .inputbar button{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:0 16px;font-family:inherit;font-size:13.5px}
  .muted{font-size:11px;color:var(--faint);line-height:1.7}
  .slider{width:100%;margin:10px 0 2px}
  .sd{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
  .category-art{display:block;width:100%;height:100%;object-fit:contain}
  .brand-icon{width:28px;height:28px;border-radius:8px;vertical-align:middle;margin-right:8px}
  .action-editor label{display:block;font-size:12px;color:var(--dim);margin:18px 0}
  .action-editor input,.action-editor textarea,.action-editor select{display:block;width:100%;margin-top:8px;padding:12px;border:1px solid var(--hair);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:14px}
  .action-editor textarea{min-height:106px;resize:vertical;line-height:1.6}
  .action-editor input:focus,.action-editor textarea:focus,.action-editor select:focus{outline:2px solid var(--olive);outline-offset:2px}
</style>

<body>
<div id="app"></div>
<div class="nav" id="nav"></div>
<script>
/* ---------------- 数据 ---------------- */
const CATS = {
  MOVE:{label:"动一动",ch:"动",color:"#5A7A4C",bg:"rgba(90,122,76,.12)"},
  CALM:{label:"静一静",ch:"静",color:"#3D5A4A",bg:"rgba(61,90,74,.12)"},
  SOCIAL:{label:"找人说两句",ch:"聊",color:"#B0842E",bg:"rgba(176,132,46,.13)"},
  PLAY:{label:"玩一下",ch:"玩",color:"#BF5B3F",bg:"rgba(191,91,63,.12)"},
  REST:{label:"歇一会儿",ch:"歇",color:"#6E6659",bg:"rgba(110,102,89,.12)"},
  FUEL:{label:"吃点喝点",ch:"吃",color:"#4A87C4",bg:"rgba(74,135,196,.12)"}
};

const DEFAULT_POOL = [
  {id:"walk",t:"下楼走一圈",m:5,c:"MOVE",cue:"别带手机，就绕楼走一圈。"},
  {id:"stairs",t:"爬两层楼梯",m:3,c:"MOVE",cue:"上两层再下来，别坐电梯。"},
  {id:"stretch",t:"站起来伸个懒腰",m:2,c:"MOVE",cue:"手举过头顶，停五秒再放下。"},
  {id:"sun",t:"去窗边晒两分钟",m:2,c:"MOVE",cue:"脸朝窗户，别刷手机。"},
  {id:"jump",t:"原地跳二十下",m:1,c:"MOVE",cue:"踮脚跳，落地轻一点。"},
  {id:"breath",t:"4-7-8 呼吸",m:3,c:"CALM",cue:"吸四拍、屏七拍、呼八拍，做四轮。"},
  {id:"far",t:"看远处两分钟",m:2,c:"CALM",cue:"找最远的楼或树，看两分钟。"},
  {id:"song",t:"听完一首歌",m:4,c:"PLAY",cue:"挑一首熟的，别切歌。"},
  {id:"shoulder",t:"揉开肩膀",m:3,c:"CALM",cue:"用手掌压住肩颈，慢慢转圈。"},
  {id:"cold",t:"冷水洗把脸",m:1,c:"CALM",cue:"水凉一点，洗到脖子。"},
  {id:"voice",t:"给朋友发条语音",m:4,c:"SOCIAL",cue:"说一句「我有点累」就够了。"},
  {id:"roommate",t:"跟室友说两句闲话",m:3,c:"SOCIAL",cue:"不聊正事，聊别的。"},
  {id:"call",t:"给家里人打个电话",m:5,c:"SOCIAL",cue:"只说三件事，别报忧。"},
  {id:"share",t:"把状态发群里",m:2,c:"SOCIAL",cue:"一个字也行。"},
  {id:"video",t:"看一个搞笑视频",m:3,c:"PLAY",cue:"一个就好，别连刷。"},
  {id:"game",t:"玩一局小游戏",m:5,c:"PLAY",cue:"一局结束就停。"},
  {id:"pet",t:"撸猫或者抱枕",m:3,c:"PLAY",cue:"抱一会儿，什么也不想。"},
  {id:"draw",t:"随手画点没用的",m:3,c:"PLAY",cue:"画丑没关系。"},
  {id:"lie",t:"平躺闭眼十分钟",m:10,c:"REST",cue:"别睡着，就躺着。"},
  {id:"eyes",t:"热敷眼睛",m:5,c:"REST",cue:"热毛巾敷五分钟。"},
  {id:"nap",t:"趴桌上眯一会儿",m:8,c:"REST",cue:"定个八分钟闹钟。"},
  {id:"wash",t:"洗把脸换件衣服",m:4,c:"REST",cue:"换件干净的，人会清醒一点。"},
  {id:"water",t:"接一杯水慢慢喝",m:1,c:"FUEL",cue:"别一口闷，慢慢喝完。"},
  {id:"fruit",t:"吃个水果",m:3,c:"FUEL",cue:"洗一下，坐下来吃。"},
  {id:"tea",t:"泡杯茶",m:4,c:"FUEL",cue:"等水开的这几分钟也算休息。"},
  {id:"nuts",t:"吃点坚果",m:2,c:"FUEL",cue:"一小把就够。"}
];

let POOL = DEFAULT_POOL.map(a=>({...a}));
const KEY="huixue_web_v1";
let S = {
  screen:"home",
  recs:[], batch:0, excluded:[],
  action:null, left:0, timerId:null, hrBefore:null,
  seenIntro:false,
  chat:null, chatInput:"",
  poolFilter:"ALL",
  flash:""
};
let data = load();

function load(){
  try{ const raw=localStorage.getItem(KEY); if(raw) return parseWebData(JSON.parse(raw),false); }catch(e){}
  return parseWebData({},false);
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} }

/* ---------------- 状态模型 ---------------- */
function assess(){
  const d = data.demo;
  let p = 0; const reasons = [];
  if(d.focus >= 120){ p += 18; reasons.push("已经连续专注 " + Math.round(d.focus) + " 分钟"); }
  else if(d.focus >= 90){ p += 12; reasons.push("连续专注 " + Math.round(d.focus) + " 分钟，快到极限了"); }
  else if(d.focus >= 60){ p += 6; reasons.push("连续专注 " + Math.round(d.focus) + " 分钟"); }
  if(d.hour >= 23 || d.hour < 5){ p += 15; reasons.push("现在是 " + d.hour + " 点，已经过了平时睡觉的时间"); }
  if(d.screen >= 40){ p += 8; reasons.push("过去一小时屏幕亮了 " + Math.round(d.screen) + " 分钟"); }
  const score = Math.max(5, Math.min(100, 100 - p));
  const band = score < 40 ? "LOW" : score < 70 ? "MID" : "HIGH";
  let headline = "状态充足，今天适合干点费脑子的。";
  if(band === "LOW") headline = "已经撑到边缘了，别再加任务。";
  else if(band === "MID") headline = "还有余量，但别硬撑了。";
  if(d.hour >= 23 || d.hour < 5){
    headline = band === "HIGH" ? "还醒着，但今天该收尾了。" : "这个点还在硬撑，先收尾再睡。";
  }
  return {score, band, headline, reasons, hour:d.hour};
}
function moodOf(score){ return score < 70 ? "worried" : score >= 85 ? "happy" : "idle"; }
function moodLabel(m){ return m === "worried" ? "在担心你" : m === "happy" ? "心情不错" : "有点困"; }

/* ---------------- 推荐 ---------------- */
function recsFor(budget, night, exclude){
  const hour = data.demo.hour;
  const lateNight = night || hour >= 23 || hour < 5;
  let cand = POOL.filter(a => !data.archived.includes(a.id) && (budget == null || a.m <= budget) && !exclude.includes(a.id));
  const inLib = /图书馆|教室/.test(S.chatScene || "");
  if(inLib) cand = cand.filter(a => !["SOCIAL","REST"].includes(a.c));
  if(lateNight){
    const quiet = cand.filter(a => ["REST","CALM","FUEL"].includes(a.c));
    if(quiet.length >= 3) cand = quiet;
  }
  const scored = cand.map(a => {
    const rs = data.records.filter(r => r.id === a.id);
    const n = rs.length;
    const avg = n ? rs.reduce((s,r)=>s+r.rate,0)/n : 0;
    let v = n ? avg/5 : 0.55;
    if(n === 0) v += 0.12;
    v += Math.random()*0.18;
    return {a, v, n, avg};
  }).sort((x,y)=>y.v-x.v);
  return scored.slice(0,3).map(o => {
    let why;
    if(o.n === 0) why = "还没试过 · 今天第一次试";
    else if(o.avg >= 4) why = "你试过 " + o.n + " 次，平均 " + o.avg.toFixed(1) + " 分";
    else if(o.avg >= 3) why = "试过 " + o.n + " 次，效果一般";
    else why = "试过 " + o.n + " 次，对你不太管用，换个角度试试";
    return {...o.a, why};
  });
}

/* ---------------- 头像 ---------------- */
function girl(mood, size){
  const state = ["happy","idle","worried"].includes(mood) ? mood : "idle";
  const w = size || 76;
  return '<img class="avatar" src="assets/art-v024/art_v024_xiaoye_'+state+'.webp" width="'+w+'" height="'+w+'" alt="" aria-hidden="true">';
}
function categoryArt(category){
  return '<img class="category-art" src="assets/art-v024/art_v024_category_'+category.toLowerCase()+'.webp" alt="'+CATS[category].label+'">';
}

/* ---------------- 图标 ---------------- */
const ICON = {
  pulse:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M2 13h4l2-5 3 10 2.5-6 1.5 3h7" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  pool:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="5" cy="6.5" r="1.6" fill="currentColor"/><path d="M9 6.5h11" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="5" cy="12" r="1.6" fill="currentColor"/><path d="M9 12h11" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="5" cy="17.5" r="1.6" fill="currentColor"/><path d="M9 17.5h11" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>',
  chart:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="12" width="4" height="8" rx="1.2" fill="currentColor"/><rect x="10" y="7" width="4" height="13" rx="1.2" fill="currentColor"/><rect x="17" y="14" width="4" height="6" rx="1.2" fill="currentColor"/></svg>',
  chat:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 6.5A3.5 3.5 0 0 1 7.5 3h9A3.5 3.5 0 0 1 20 6.5v6A3.5 3.5 0 0 1 16.5 16H10l-5 4v-4.4A3.5 3.5 0 0 1 4 12.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
  person:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.6" stroke="currentColor" stroke-width="1.9"/><path d="M4.5 20c1.4-3.8 4-5.6 7.5-5.6s6.1 1.8 7.5 5.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>'
};

/* ---------------- 视图 ---------------- */
function view(){
  switch(S.screen){
    case "rec": return viewRec();
    case "timer": return viewTimer();
    case "rate": return viewRate();
    case "graph": return viewGraph();
    case "pool": return viewPool();
    case "chat": return viewChat();
    case "mine": return viewMine();
    case "edit": return viewActionEditor();
    case "backup": return viewBackup();
    default: return viewHome();
  }
}

function ring(score){
  const r = 44, c = 2*Math.PI*r, off = c*(1-score/100);
  const col = score < 40 ? "#BF5B3F" : score < 70 ? "#B0842E" : "#3D5A4A";
  return '<div class="ring"><svg width="104" height="104" viewBox="0 0 104 104">'
    + '<circle cx="52" cy="52" r="'+r+'" stroke="#EDE7DD" stroke-width="7.5" fill="none"/>'
    + '<circle cx="52" cy="52" r="'+r+'" stroke="'+col+'" stroke-width="7.5" fill="none" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"/>'
    + '</svg><div class="num"><span class="big">'+score+'</span><span class="small">/ 100</span></div></div>';
}

function viewHome(){
  const a = assess();
  const m = moodOf(a.score);
  const done = data.records.length;
  const moodColor = m === "worried" ? "#8FB6DA" : m === "happy" ? "#9DC08B" : "#C7BCA9";
  const bandText = a.band === "LOW" ? "低电量" : a.band === "MID" ? "还有余量" : "状态充足";
  const note = data.records.length ? data.records[data.records.length-1].id : null;
  const last = note ? POOL.find(p=>p.id===note) : null;
  let bubble;
  if(m === "worried") bubble = "我有点担心你。今天绷得有点久了，让我用五分钟把你捞回来？";
  else if(m === "happy") bubble = "状态挺好的呀，今天适合干点费脑子的活。";
  else if(last) bubble = "上次你选了「"+last.t+"」，后来怎么样了？";
  else bubble = "我在。累的时候叫我一声，五分钟以内的事我都能安排。";
  return `
  <div class="top">
    <div>
      <div class="brand"><img class="brand-icon" src="assets/art-v024/app-icon.webp" alt="">回血实验室</div>
      <div class="sub">${done? "今天 · 已完成 "+done+" 次实验" : "今天 · 还没开始第一次"}</div>
    </div>
    <div class="pill">${ICON.pulse} 演示数据</div>
  </div>

  <div class="card">
    <div class="hero">
      ${ring(a.score)}
      <div>

function parseIntent(text){
  const t = text || "";
  let mood = "OK";
  if(/麻木|空|没感觉|无聊|提不起|摆烂|没劲|学不进去/.test(t)) mood = "NUMB";
  else if(/烦|焦虑|慌|压力|紧张|怕|赶不上|来不及/.test(t)) mood = "ANXIOUS";
  else if(/累|困|撑不住|没力气|疲惫|熬不住|睡不够|打不起精神/.test(t)) mood = "TIRED";
  let mins = null;
  const m = t.match(/([0-9]+|[一二三四五六七八九十两半]+)\s*个?\s*(小时|分钟|分)/);
  if(m){
    const raw = m[1], unit = m[2];
    let v;
    const cn = {"一":1,"二":2,"两":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9,"十":10,"半":0.5};
    if(/^[0-9]+$/.test(raw)) v = parseInt(raw,10);
    else if(raw === "半") v = 0.5;
    else v = (cn[raw] !== undefined) ? cn[raw] : (raw.length===2 && raw[0]==="十" ? 10+(cn[raw[1]]||0) : null);
    if(v!==null && v!==undefined) mins = (unit==="小时" ? v*60 : v);
  }
  let scene = "";
  if(/图书馆/.test(t)) scene = "在图书馆";
  else if(/教室|上课/.test(t)) scene = "在教室";
  else if(/宿舍|寝室/.test(t)) scene = "在宿舍";
  else if(/路上|地铁|公交/.test(t)) scene = "在路上";
  return {mood, mins, scene};
}

function greet(a, m){
  const name = "";
  if(m === "worried"){
    return a.hour >= 23 || a.hour < 5
      ? "还醒着。你现在这个状态，我有点担心，别硬扛到天亮。"
      : "看你今天绷得不轻。先别急着继续，我们挑一件小事先做。";
  }
  if(a.hour >= 23 || a.hour < 5) return "这个点还不睡。撑不住的时候可以来这儿坐会儿。";
  return "我在。累的时候跟我说一句，五分钟以内的事我都能安排。";
}

function reply(text){
  const it = parseIntent(text);
  S.chatScene = it.scene;
  const a = assess();
  const recs = recsFor(it.mins, a.hour>=23||a.hour<5, []);
  let lead;
  if(it.mood === "NUMB") lead = "提不起劲的时候，先让身体动一下比讲道理有用。";
  else if(it.mood === "ANXIOUS") lead = "烦就先别想那件事。我们做一件跟它无关的小事。";
  else if(it.mood === "TIRED") lead = "累了就是累了，不用撑。";
  else lead = "嗯，我在听。";
  if(it.mins) lead += "你说的 " + it.mins + " 分钟以内，我按这个挑的。";
  if(it.scene) lead += "（" + it.scene + "的话，不给你要说话或者要躺下的选项。）";
  lead += recs.length ? "下面 " + recs.length + " 个，挑一个，做完回来告诉我管不管用。"
    : "按这个条件没剩下合适的了，把时间或条件放宽一点再试试。";
  return {text: lead, recs};
}

function validWebAction(a){
  return a && typeof a.id==='string' && /^[A-Za-z0-9_-]{1,100}$/.test(a.id) &&
    typeof a.t==='string'&&a.t.trim().length>0&&a.t.length<=80&&Number.isInteger(a.m)&&a.m>=1&&a.m<=10&&
    Object.hasOwn(CATS,a.c)&&typeof a.cue==='string'&&a.cue.length<=500;
}
function validWebSession(s){
  return s&&typeof s.id==='string'&&/^[A-Za-z0-9_-]{1,100}$/.test(s.id)&&validWebAction(s.action)&&
    Number.isSafeInteger(s.startedAt)&&s.startedAt>=0&&Number.isSafeInteger(s.deadline)&&s.deadline>=s.startedAt&&
    ['LOW','MID','HIGH'].includes(s.band)&&['RUNNING','PAUSED','FEEDBACK'].includes(s.phase)&&
    Number.isInteger(s.pausedSeconds)&&s.pausedSeconds>=0&&s.pausedSeconds<=s.action.m*60;
}
function parseWebData(saved,strict){
  if(!saved||typeof saved!=='object'||Array.isArray(saved)) throw Error('数据格式不正确');
  let actions=saved.actions||DEFAULT_POOL;
  if(!Array.isArray(actions)||actions.length>1000||!actions.every(validWebAction)||new Set(actions.map(a=>a.id)).size!==actions.length){
    if(strict) throw Error('行动内容不正确'); actions=DEFAULT_POOL;
  }
  const ids=new Set(actions.map(a=>a.id));
  const raw=Array.isArray(saved.records)?saved.records:[];
  if(raw.length>20000) throw Error('记录过多');
  const records=raw.filter(r=>r&&typeof r.id==='string'&&(ids.has(r.id)||validWebAction(r.action))&&
    Number.isInteger(r.rate)&&r.rate>=1&&r.rate<=5&&Number.isSafeInteger(r.ts)&&r.ts>=0&&
    Number.isInteger(r.hour)&&r.hour>=0&&r.hour<=23&&(!r.action||(validWebAction(r.action)&&r.action.id===r.id))&&
    (!r.sessionId||typeof r.sessionId==='string')).map(r=>({...r,action:r.action||actions.find(a=>a.id===r.id)}));
  const sessionIds=records.map(r=>r.sessionId).filter(Boolean);
  if(new Set(sessionIds).size!==sessionIds.length) throw Error('实验记录重复');
  if(strict&&records.length!==raw.length) throw Error('实验记录不完整');
  const flags=k=>{ const f=saved[k]||[];if(!Array.isArray(f)||(strict&&f.some(id=>!ids.has(id)))) throw Error('收藏或归档不正确');return [...new Set(f.filter(id=>ids.has(id)))];};
  const demo=saved.demo||{};const finite=(v,f)=>Number.isFinite(v)?v:f;
  let session=saved.session||null;
  if(session&&(!validWebSession(session)||sessionIds.includes(session.id))){if(strict) throw Error('行动进度不正确');session=null;}
  return {actions:actions.map(a=>({...a})),records,favorites:flags('favorites'),archived:flags('archived'),session,
    nudgeOn:typeof saved.nudgeOn==='boolean'?saved.nudgeOn:true,
    demo:{focus:Math.max(0,finite(demo.focus,125)),screen:Math.max(0,Math.min(60,finite(demo.screen,45))),
    hour:Math.max(0,Math.min(23,Math.floor(finite(demo.hour,new Date().getHours()))))}};
}
function commitWeb(next){
  localStorage.setItem(KEY,JSON.stringify(next));data=next;POOL=data.actions;
}
function webRemaining(s,now=Date.now()){
  if(s.phase==='FEEDBACK')return 0;
  return s.phase==='PAUSED'?s.pausedSeconds:Math.max(0,Math.min(s.action.m*60,Math.ceil((s.deadline-now)/1000)));
}
function resumeAction(){
  const s=data.session;if(!s)return;
  S.action={...s.action};S.left=webRemaining(s);S.rateSel=undefined;
  S.screen=s.phase==='FEEDBACK'?'rate':'timer';
  stopTimer();if(s.phase==='RUNNING')S.timerId=setInterval(tickWebSession,250);render();
}
function tickWebSession(){
  const s=data.session;if(!s||s.phase!=='RUNNING')return;
  S.left=webRemaining(s);
  if(S.left===0){finishWebSession();return;}
  const c=document.getElementById('countdown'),b=document.getElementById('tbar');
  if(c)c.textContent=String(Math.floor(S.left/60)).padStart(2,'0')+':'+String(S.left%60).padStart(2,'0');
  if(b)b.style.width=(100*(1-S.left/(s.action.m*60)))+'%';
}
function finishWebSession(){
  if(!data.session)return;commitWeb({...data,session:{...data.session,phase:'FEEDBACK'}});
  stopTimer();S.action={...data.session.action};S.screen='rate';S.rateSel=undefined;render();
}
function saveWebFeedback(){
  const s=data.session;if(!s||s.phase!=='FEEDBACK'||!Number.isInteger(S.rateSel)||S.rateSel<1||S.rateSel>5)return;
  const now=new Date();let records=data.records;
  if(!records.some(r=>r.sessionId===s.id))records=[...records,{id:s.action.id,action:{...s.action},sessionId:s.id,rate:S.rateSel,hour:now.getHours(),ts:now.getTime()}];
  commitWeb({...data,records,session:null});stopTimer();S.flash='记下来了。';S.screen='graph';S.action=null;render();
}
function viewActionEditor(){
  const a=POOL.find(a=>a.id===S.editId)||{t:'',m:3,c:'CALM',cue:''};
  return `<div class="action-editor"><button class="chip" data-go="pool">返回回血池</button><h2>${S.editId?'编辑':'新增'}行动</h2>
  <label>行动名称<input id="action-title" maxlength="80" value="${esc(a.t)}" style="display:block;width:100%;padding:12px"></label>
  <label>第一步怎么做<textarea id="action-cue" maxlength="500" style="display:block;width:100%;padding:12px">${esc(a.cue)}</textarea></label>
  <label>时长（1–10 分钟）<input id="action-minutes" type="number" min="1" max="10" value="${a.m}"></label>
  <label>分类<select id="action-category">${Object.entries(CATS).map(([c,v])=>`<option value="${c}" ${c===a.c?'selected':''}>${v.label}</option>`).join('')}</select></label>
  <button class="btn" data-save-action="1" style="margin-top:18px">保存行动</button></div>`;
}
function webBackupText(){return JSON.stringify({format:'huixue-lab-backup',version:1,platform:'web',createdAt:Date.now(),data},null,2);}
function decodeWebBackup(text){
  if(new TextEncoder().encode(text).length>8*1024*1024)throw Error('备份不能超过 8 MB');
  const o=JSON.parse(text.replace(/^\uFEFF/,''));
  if(o.format!=='huixue-lab-backup'||o.version!==1||o.platform!=='web')throw Error('请选择网页版导出的备份，安卓备份请在安卓内恢复');
  if(!o.data||!Array.isArray(o.data.actions)||!Array.isArray(o.data.records)||!Array.isArray(o.data.favorites)||!Array.isArray(o.data.archived))throw Error('备份内容不完整');
  return parseWebData(o.data,true);
}
function importWebBackup(next){
  if(data.session)throw Error('请先完成或取消进行中的行动');
  localStorage.setItem(KEY+'_before_import',JSON.stringify(data));commitWeb(next);S.preview=null;S.flash='恢复完成，同一份备份不会叠加记录。';
}
function viewBackup(){
  return `<button class="chip" data-go="mine">返回我的</button><h2>备份与恢复</h2><p class="muted">保存本浏览器的行动、实验、收藏、归档、演示设置及进行中的行动。网页版与安卓备份分别恢复。</p>
  <button class="btn" data-export-backup="1">导出完整备份</button><p>选择网页版备份文件（8 MB 以内）</p><input id="backup-file" type="file" accept=".json,application/json" ${data.session?'disabled':''}>
  ${data.session?'<p>先完成或取消进行中的行动，再导入。</p>':''}
  ${S.preview?`<div class="card"><p>${S.preview.actions.length} 个行动 · ${S.preview.records.length} 条实验 · ${S.preview.favorites.length} 个收藏</p><p>确认后将替换当前数据，导入前会保留一份本机副本。</p><button class="btn" data-confirm-import="1">确认恢复</button></div>`:''}
  <button class="btn ghost" data-undo-import="1">恢复到上一次导入前</button>`;
}
document.addEventListener('visibilitychange',()=>{if(data.session&&S.screen==='timer')tickWebSession();});
document.addEventListener('change',async e=>{
  if(e.target.id!=='backup-file'||!e.target.files[0])return;
  try{const file=e.target.files[0];if(file.size>8*1024*1024)throw Error('备份不能超过 8 MB');S.preview=decodeWebBackup(await file.text());S.flash='文件已检查，尚未修改数据。';}
  catch(err){S.preview=null;S.flash='无法导入：'+err.message;}render();
});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-edit-action],[data-save-action],[data-favorite],[data-archive],[data-pool-mode],[data-resume-session],[data-pause-session],[data-export-backup],[data-confirm-import],[data-undo-import]');
  if(!el)return;
  try{
    if(el.hasAttribute('data-edit-action')){S.editId=el.dataset.editAction==='new'?null:el.dataset.editAction;S.screen='edit';}
    else if(el.hasAttribute('data-save-action')){
      const id=S.editId||'custom_'+Date.now()+'_'+Math.random().toString(36).slice(2);
      const a={id,t:document.getElementById('action-title').value.trim(),cue:document.getElementById('action-cue').value.trim(),m:Number(document.getElementById('action-minutes').value),c:document.getElementById('action-category').value};
      if(!validWebAction(a)||!a.cue)throw Error('请填写名称、第一步和 1–10 分钟的整数时长');
      if(!S.editId&&POOL.length>=1000)throw Error('行动池已满');
      commitWeb({...data,actions:S.editId?POOL.map(old=>old.id===id?a:old):[...POOL,a]});S.screen='pool';S.flash='行动已保存。';
    }else if(el.hasAttribute('data-favorite')||el.hasAttribute('data-archive')){
      const key=el.hasAttribute('data-favorite')?'favorites':'archived';const id=el.dataset.favorite||el.dataset.archive;
      if(!POOL.some(a=>a.id===id))return;const ids=data[key];commitWeb({...data,[key]:ids.includes(id)?ids.filter(v=>v!==id):[...ids,id]});
    }else if(el.hasAttribute('data-pool-mode'))S.poolMode=el.dataset.poolMode;
    else if(el.hasAttribute('data-resume-session')){resumeAction();return;}
    else if(el.hasAttribute('data-pause-session')){
      const se=data.session;if(!se)return;
      const next=se.phase==='PAUSED'?{...se,phase:'RUNNING',deadline:Date.now()+se.pausedSeconds*1000}:{...se,phase:'PAUSED',pausedSeconds:webRemaining(se)};
      commitWeb({...data,session:next});resumeAction();return;
    }else if(el.hasAttribute('data-export-backup')){
      const url=URL.createObjectURL(new Blob([webBackupText()],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='huixue-web-backup.json';a.click();URL.revokeObjectURL(url);S.flash='备份已交给浏览器保存。';
    }else if(el.hasAttribute('data-confirm-import')){if(S.preview&&confirm('替换本浏览器中的业务数据？导入前会保留副本。'))importWebBackup(S.preview);}
    else if(el.hasAttribute('data-undo-import')){
      const old=localStorage.getItem(KEY+'_before_import');if(!old)throw Error('还没有导入前的副本');
      if(confirm('用导入前的副本替换当前数据？'))importWebBackup(parseWebData(JSON.parse(old),true));
    }
  }catch(err){S.flash='操作未完成：'+err.message;}render();
});
POOL=data.actions;

/* 启动 */
render();
</script>
</body>
</html>
